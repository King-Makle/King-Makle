name: Generate contribution snake

on:
  schedule:
    # Twice a day
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Reads the contribution CALENDAR (not the repo list), so private
      # contributions are included as long as "Private contributions" is
      # enabled on the profile.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%239E7F5F&color_dots=%23EBEDF0,%23D8C3A5,%23C9A375,%239E7F5F,%2368513C
            dist/snake-dark.svg?color_snake=%23EFC38F&color_dots=%23161616,%2368513C,%239E7F5F,%23C9A375,%23EFC38F
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
